databases:
  - name: villainous-db
    plan: free
    databaseName: transcendence
    user: postgres

services:
  - type: web
    name: villainous-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: villainous-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FORTYTWO_CLIENT_ID
        sync: false
      - key: FORTYTWO_CLIENT_SECRET
        sync: false
      - key: FORTYTWO_REDIRECT_URI
        sync: false

  - type: web
    name: villainous-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
